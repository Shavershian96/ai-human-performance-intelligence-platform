[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-human-performance-platform"
version = "1.0.0"
description = "AI Human Performance Intelligence Platform - End-to-end ML system for human performance prediction"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Shavershian96", email = "daniel.eric@hotmail.com"}
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.29.0",
    "prometheus-client>=0.19.0",
    "httpx>=0.26.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    # Upper-bounded on purpose: a minor Ruff bump can add rules to the selected
    # categories and fail CI on a commit that changed no source.
    "ruff>=0.16,<0.17",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
# Every module imports as `src.<layer>...`, so the distribution has to ship the
# `src` package itself. Discovering from inside src/ instead installs `api`,
# `core`, ... at top level and `import src.core` fails outside the repo root.
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly rather than relying on Ruff's implicit defaults: those
# defaults widen between releases, which silently turns an unpinned CI lint
# step red on a build that changed no source at all.
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # import ordering
    "UP", # pyupgrade
    "B",  # bugbear
]

[tool.ruff.lint.per-file-ignores]
# The Streamlit app embeds CSS and HTML as inline string literals, where a
# 100-column limit forces breaks that hurt readability. Every other rule
# (unused imports, bugbear, pyupgrade, import order) still applies here.
"dashboard/app.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a call in an argument default, which
# is precisely what B008 flags. These are evaluated once at import and are the
# framework's documented usage, so exempt them rather than restructure routes.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
