# Autoscaling targets differ per service because their load shapes differ:
# the API is latency-sensitive and request-driven, ingestion is bursty but
# cheap per request, and training is long-running and CPU-bound.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: predictions-api-hpa
  namespace: perf-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: predictions-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-ingestion-hpa
  namespace: perf-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-ingestion
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-trainer-hpa
  namespace: perf-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-trainer
  # Training runs are long and CPU-bound. Scaling out mid-run does not finish
  # the job that is already in flight, so the ceiling is low and the threshold
  # high: this absorbs concurrent trigger bursts rather than chasing CPU.
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 85
  behavior:
    scaleDown:
      # Do not tear down a replica that may still be finishing a training run.
      stabilizationWindowSeconds: 300
