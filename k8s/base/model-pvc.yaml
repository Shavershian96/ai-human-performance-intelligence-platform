apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-storage
  namespace: perf-platform
spec:
  # ReadWriteMany because the trainer writes the model artifacts and the API
  # pods read them, and those pods are not pinned to one node. This requires a
  # StorageClass that supports RWX (NFS, CephFS, EFS, Azure Files); plain block
  # storage and single-node provisioners only offer ReadWriteOnce.
  # See k8s/overlays/kind for the single-node adaptation.
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
