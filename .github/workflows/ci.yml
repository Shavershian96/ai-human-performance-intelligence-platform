name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: perf_user
          POSTGRES_PASSWORD: perf_password
          POSTGRES_DB: performance_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perf_user -d performance_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install the pinned dev toolchain from pyproject rather than an
          # unpinned ad-hoc list, so local and CI lint results agree.
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts dashboard

      - name: Type check
        run: mypy src/

      - name: Unit tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: perf_user
          POSTGRES_PASSWORD: perf_password
          POSTGRES_DB: performance_db
        run: pytest -v --cov=src --cov-report=term --cov-report=xml

  docker-compose-validate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.deploy.yml config

  build-and-push:
    runs-on: ubuntu-latest
    needs: docker-compose-validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            dockerfile: Dockerfile
            image: perf-platform-api
          - name: data-ingestion
            dockerfile: Dockerfile.data-ingestion
            image: perf-platform-data-ingestion
          - name: ml-trainer
            dockerfile: Dockerfile.ml-trainer
            image: perf-platform-ml-trainer
          - name: dashboard
            dockerfile: Dockerfile.dashboard
            image: perf-platform-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR rejects any tag whose namespace contains uppercase, and
      # github.repository_owner preserves the account's original casing.
      - name: Resolve image namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.service.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.service.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image:
          - perf-platform-api
          - perf-platform-data-ingestion
          - perf-platform-ml-trainer
          - perf-platform-dashboard
    steps:
      # Same lowercase requirement as the build job - the pulled reference has
      # to match the pushed one exactly.
      - name: Resolve image namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.ns.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          # Gate on vulnerabilities that have a fix available. Without this the
          # base image's unfixed CVEs fail every build with no action to take.
          ignore-unfixed: true
          exit-code: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      # The secrets context is not available in job-level `if:`, so the
      # "deploy only when configured" gate has to be evaluated in a step.
      - name: Check deploy secrets are configured
        id: deploy_secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] \
             && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_PATH" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets not set - skipping deploy."
          fi
          # The compose file pulls ghcr.io/$IMAGE_NAMESPACE/... so this has to
          # be lowercase for the same reason the build tags are.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH with Docker Compose
        if: steps.deploy_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_NAMESPACE: ${{ steps.deploy_secrets.outputs.owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: IMAGE_TAG,IMAGE_NAMESPACE,GHCR_USER,GHCR_TOKEN
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG="$IMAGE_TAG"
            export IMAGE_NAMESPACE="$IMAGE_NAMESPACE"
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
